<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Elmech Labs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Line Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #ffffff;
    }

    /* ================= HEADER ================= */
    header {
      padding: 15px 40px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    header img {
      width: 45px;
    }

    header ul {
      display: flex;
      list-style: none;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    header ul li a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    header ul li a.active {
      color: #f6a400;
    }

    /* ================= CONTACT ================= */
    .contact-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .contact-card {
      text-align: center;
      max-width: 650px;
      width: 100%;
      padding: 10px;
    }

    .contact-logo {
      width: 95px;
      margin-bottom: 18px;
    }

    .contact-text {
      font-size: 16px;
      margin-bottom: 26px;
      color: #333;
      line-height: 1.6;
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .btn-call {
      background: #0d6efd;
      color: #fff;
      padding: 11px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-landline {
      background: #6c757d;
      color: #fff;
      padding: 11px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-whatsapp {
      background: #198754;
      color: #fff;
      padding: 11px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
    }

    .contact-divider {
      width: 60px;
      height: 3px;
      background: #f6a400;
      margin: 30px auto;
      border-radius: 5px;
    }

    .contact-emails {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .contact-emails a {
      color: #0d6efd;
      font-weight: 500;
      text-decoration: underline;
    }

    /* ================= MAP ================= */
    .contact-map {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .contact-map iframe {
      width: 100%;
      max-width: 650px;
      height: 230px;
      border: 0;
      border-radius: 14px;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 10px;
      }

      .contact-map iframe {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="logo">
    <img src="images/logo.png" alt="Elmech Labs">
    <span>Elmech Labs Pvt. Ltd.</span>
  </div>

  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="training.html">Training</a></li>
    <li><a href="contact.html" class="active">Contact Us</a></li>
  </ul>
</header>

<!-- ================= CONTACT ================= -->
<section class="contact-wrapper">
  <div class="contact-card">

    <img src="images/logo.png" class="contact-logo" alt="Logo">

    <p class="contact-text">
      <b>Elmech Labs Pvt. Ltd.</b><br>
      Material Testing Laboratory<br>
      A-37, Sector-63, Noida – 201301
    </p>

    <div class="contact-actions">
      <a href="tel:+919899100577" class="btn-call">
        <i class="las la-mobile"></i> 98 99 100 577
      </a>

      <a href="tel:01204563398" class="btn-landline">
        <i class="las la-phone"></i> 0120-4563398
      </a>

      <a href="https://wa.me/919899100577" target="_blank" class="btn-whatsapp">
        <i class="lab la-whatsapp"></i> WhatsApp
      </a>
    </div>

    <div class="contact-divider"></div>

    <div class="contact-emails">
      <a href="mailto:testing@elmechlabs.com">testing@elmechlabs.com</a>
      <a href="mailto:accounts@elmechlabs.com">accounts@elmechlabs.com</a>
    </div>

    <!-- MAP -->
    <div class="contact-map">
      <iframe
        src="https://www.google.com/maps?q=Elmech%20Labs%20Pvt.%20Ltd.%20Noida&output=embed"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>

  </div>
</section>

</body>
</html>
